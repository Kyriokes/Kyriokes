name: Generate snake

on:
  schedule:
    # Todos los días a las 00:00 de Argentina (03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Mapa de calor: amarillo, naranja, rojo y violeta según la cantidad de contribuciones
          outputs: |
            dist/github-snake.svg?color_snake=#2da44e&color_dots=#ebedf0,#ffd43b,#ff8c00,#e5383b,#9d4edd
            dist/github-snake-dark.svg?color_snake=#39d353&color_dots=#161b22,#ffd43b,#ff8c00,#e5383b,#9d4edd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
